<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Stack Analyzer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      min-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
    }

    .header {
      background: linear-gradient(135deg, #4285f4, #34a853);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 18px;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .content {
      padding: 20px;
    }

    .section {
      margin-bottom: 28px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(66,133,244,0.04);
      border: 1px solid #e3e6ea;
      padding: 18px 16px 12px 16px;
      position: relative;
    }

    .section:not(:last-child)::after {
      content: '';
      display: block;
      height: 1px;
      background: #f0f1f3;
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: -14px;
      border-radius: 1px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
    }

    .section-title::before {
      content: '';
      width: 3px;
      height: 14px;
      background: #4285f4;
      margin-right: 8px;
      border-radius: 2px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: #4285f4;
      color: white;
    }

    .btn-primary:hover {
      background: #3367d6;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: white;
      color: #5f6368;
      border: 1px solid #dadce0;
    }

    .btn-secondary:hover {
      background: #f8f9fa;
      border-color: #4285f4;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    .status {
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .status-info {
      background: #e8f0fe;
      color: #1967d2;
      border: 1px solid #d2e3fc;
    }

    .status-success {
      background: #e6f4ea;
      color: #137333;
      border: 1px solid #ceead6;
    }

    .status-error {
      background: #fce8e6;
      color: #d93025;
      border: 1px solid #fad2cf;
    }

    .status-warning {
      background: #fef7e0;
      color: #f29900;
      border: 1px solid #fdd663;
    }

    .config-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: white;
      border: 1px solid #dadce0;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .config-status.configured {
      border-color: #34a853;
      background: #f0f9f4;
    }

    .config-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ea4335;
    }

    .config-indicator.active {
      background: #34a853;
    }

    .result-container {
      max-height: 200px;
      overflow-y: auto;
      background: white;
      border: 1px solid #dadce0;
      border-radius: 6px;
      padding: 12px;
      font-size: 12px;
      line-height: 1.4;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #4285f4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .footer {
      padding: 15px 20px;
      background: white;
      border-top: 1px solid #dadce0;
      text-align: center;
    }

    .footer a {
      color: #4285f4;
      text-decoration: none;
      font-size: 12px;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }

    .slider.round:before {
      border-radius: 50%;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: white;
      border: 1px solid #dadce0;
      border-radius: 6px;
      font-size: 13px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
    }

    input:checked + .slider {
      background-color: #4285f4;
    }

    input:checked + .slider:before {
      transform: translateX(14px);
    }

    select {
      width: 100%;
      padding: 8px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      background-color: white;
      font-size: 13px;
    }

    .form-group {
      margin-bottom: 10px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔍 Tech Stack Analyzer</h1>
    <p>AI驱动的网站技术栈分析工具</p>
  </div>

  <div class="content">
    <!-- 状态显示区域 -->
    <div id="status-container"></div>

    <!-- 快速分析 -->
    <div class="section section-analyze">
      <div class="section-title">快速分析</div>
      <button id="analyze-btn" class="btn btn-primary">
        <span>🚀</span>
        <span>分析当前页面</span>
      </button>
    </div>

    <!-- 通用设置 -->
    <div class="section section-general">
      <div class="section-title">通用设置</div>
      <div class="setting-item">
        <label for="show-button-toggle">在页面上显示快速分析按钮</label>
        <label class="switch">
          <input type="checkbox" id="show-button-toggle">
          <span class="slider round"></span>
        </label>
      </div>
      <div class="section-title">分析设置</div>
      <div class="form-group">
        <label for="default-provider">默认AI提供商</label>
        <select id="default-provider">
          <option value="openai">OpenAI GPT</option>
          <option value="gemini">Google Gemini</option>
          <option value="claude">Anthropic Claude</option>
        </select>
      </div>
      <div class="form-group">
        <label for="analysis-depth">分析深度</label>
        <select id="analysis-depth">
          <option value="basic">基础分析</option>
          <option value="detailed">详细分析</option>
          <option value="comprehensive">全面分析</option>
        </select>
      </div>
      <div class="setting-item">
        <label for="auto-analyze-toggle">自动分析新页面</label>
        <label class="switch">
          <input type="checkbox" id="auto-analyze-toggle">
          <span class="slider round"></span>
        </label>
      </div>
      <div style="margin-top: 15px;">
        <button id="save-settings-btn" class="btn btn-primary">
          <span>💾</span>
          <span>保存设置</span>
        </button>
      </div>
    </div>

    <!-- AI提供商配置 -->
    <div class="section section-provider">
      <div class="section-title">AI提供商配置</div>
      <div id="providers-status">
        <div class="config-status" data-provider="openai">
          <span>OpenAI GPT</span>
          <div class="config-indicator"></div>
        </div>
        <div class="config-status" data-provider="gemini">
          <span>Google Gemini</span>
          <div class="config-indicator"></div>
        </div>
        <div class="config-status" data-provider="claude">
          <span>Anthropic Claude</span>
          <div class="config-indicator"></div>
        </div>
      </div>
      <button id="config-btn" class="btn btn-secondary">
        <span>⚙️</span>
        <span>配置设置</span>
      </button>
    </div>

    <!-- 历史记录 -->
    <div class="section section-history">
      <div class="section-title">历史记录</div>
      <button id="history-btn" class="btn btn-secondary">
        <span>📋</span>
        <span>查看历史记录</span>
      </button>
    </div>

    <!-- 分析结果区域 -->
    <div id="result-section" class="section hidden">
      <div class="section-title">分析结果</div>
      <div id="result-container" class="result-container"></div>
    </div>
  </div>

  <!-- <div class="footer">
    <a href="#" id="help-link">使用帮助</a> | 
    <a href="#" id="feedback-link">反馈建议</a>
  </div> -->

  <script src="popup.js"></script>
</body>
</html>
